<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock-Paper-Scissor</title>
  
  <link rel="stylesheet" href="04-Rock-Paper-Scissor.css">
  
</head>
<body>
  <h1>Rock Paper Scissor</h1>
  <button onclick="
      playGame('rock');
      " class="move-button">
    <img src="https://supersimple.dev/projects/rock-paper-scissors/images/rock-emoji.png" class="move-icon">
  </button>

    <button onclick="
        playGame('paper');            k
        " class="move-button">
        <img src="https://supersimple.dev/projects/rock-paper-scissors/images/paper-emoji.png" class="move-icon">
    </button>

    <button onclick="
        playGame('scissors')
        " class="move-button">
        <img src="https://supersimple.dev/projects/rock-paper-scissors/images/scissors-emoji.png" class="move-icon">
    </button>

    <p class="js-result result"></p>

    <p class="js-moves emoji"></p>

    <p class="js-score score"></p>

    <button onclick="
    score.wins = 0;
    score.ties = 0;
    score.losses=0;
    localStorage.removeItem('score');
    updatescoreElement();
    " class="Reset-score-button">Reset Score</button>

    <button class="auto-play-button" onclick="autoplay();">Auto Play</button>

    <script src="04-Rock-Paper-Scissor.js"></script>
</body>
</html>
